# Use an in-memory database in SQL Server compatibility mode for repeatable backend tests.
# create-drop recreates the test schema; it does not reset the real SQL Server assignment database.
spring.datasource.url=jdbc:h2:mem:a2;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.seed.enabled=true
