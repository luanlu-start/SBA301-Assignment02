spring.application.name=A2LuanLH_SE1910
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2LuanLH_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YOUR_SQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS}
app.seed.enabled=true
app.staff.email=staff@hotel.local
app.staff.password=${STAFF_PASSWORD:Staff@123}
