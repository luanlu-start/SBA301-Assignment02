spring.application.name=A2LuanLH_SE1910
# Load optional local credentials from either backend working directory or project-root working directory.
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties
# ${ENV:default} uses an environment value when set, otherwise the default after the colon.
server.port=${SERVER_PORT:8082}
# SQL Server JDBC URL: select this assignment database. Keep real credentials in the ignored local file.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2LuanLH_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:YOUR_SQL_PASSWORD}
# update adjusts mapped tables during startup; it does not create the SQL Server database itself.
spring.jpa.hibernate.ddl-auto=update
# Close persistence access before JSON rendering; services must read LAZY relations while building response DTOs.
spring.jpa.open-in-view=false
# Keep the exact table/column names declared in entity annotations instead of converting them to snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Reject fields absent from request DTOs, such as a role in ProfileRequest or a client-supplied author ID.
spring.jackson.deserialization.fail-on-unknown-properties=true
# Avoid including internal exception messages in the default server error response; API handlers provide controlled messages.
server.error.include-message=never
# Enable initial sample accounts/news when the account table is empty; existing account data skips seeding.
app.seed.enabled=true
# Authentication lives on the server; the browser sends this HttpOnly session cookie.
server.servlet.session.cookie.name=A2SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
